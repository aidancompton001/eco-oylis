<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="20" fill="#111413"/>

  <text x="400" y="45" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#f0ede8" text-anchor="middle">Collection Process</text>

  <circle cx="130" cy="200" r="55" fill="#0d0f0e" stroke="#c8913a" stroke-width="2"/>
  <text x="130" y="190" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#c8913a" text-anchor="middle">01</text>
  <text x="130" y="215" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#f0ede8" text-anchor="middle">Contact</text>
  <text x="130" y="290" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">Reach out to the</text>
  <text x="130" y="305" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">representation</text>

  <path d="M195 200 L255 200" stroke="#c8913a" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <polygon points="255,194 267,200 255,206" fill="#c8913a" opacity="0.6"/>

  <circle cx="310" cy="200" r="55" fill="#0d0f0e" stroke="#6b7c3f" stroke-width="2"/>
  <text x="310" y="190" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#6b7c3f" text-anchor="middle">02</text>
  <text x="310" y="215" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#f0ede8" text-anchor="middle">Agreement</text>
  <text x="310" y="290" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">Individual</text>
  <text x="310" y="305" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">terms</text>

  <path d="M375 200 L435 200" stroke="#c8913a" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <polygon points="435,194 447,200 435,206" fill="#c8913a" opacity="0.6"/>

  <circle cx="490" cy="200" r="55" fill="#0d0f0e" stroke="#c8913a" stroke-width="2"/>
  <text x="490" y="190" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#c8913a" text-anchor="middle">03</text>
  <text x="490" y="215" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#f0ede8" text-anchor="middle">Containers</text>
  <text x="490" y="290" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">Delivery of</text>
  <text x="490" y="305" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">20-1000L containers</text>

  <path d="M555 200 L615 200" stroke="#c8913a" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <polygon points="615,194 627,200 615,206" fill="#c8913a" opacity="0.6"/>

  <circle cx="670" cy="200" r="55" fill="#0d0f0e" stroke="#6b7c3f" stroke-width="2"/>
  <text x="670" y="190" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#6b7c3f" text-anchor="middle">04</text>
  <text x="670" y="215" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#f0ede8" text-anchor="middle">Collection</text>
  <text x="670" y="290" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">Regular pickup</text>
  <text x="670" y="305" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(240,237,232,0.5)" text-anchor="middle">on schedule</text>

  <path d="M670 265 C670 350 130 350 130 265" stroke="#c8913a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.3"/>
  <text x="400" y="370" font-family="Inter,Arial,sans-serif" font-size="10" fill="rgba(200,145,58,0.5)" text-anchor="middle">Cyclical process — regular collection</text>

  <circle cx="50" cy="80" r="15" fill="#c8913a" opacity="0.06"/>
  <circle cx="750" cy="100" r="20" fill="#6b7c3f" opacity="0.06"/>
</svg>
